<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>AI 聊天终端</title>
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-mark">✦</span><span>AI 终端</span></div>
        <button class="icon-button mobile-close" id="closeSidebar" aria-label="关闭会话列表">×</button>
      </div>
      <button class="new-session" id="newSession"><span>＋</span> 新建会话</button>
      <div class="session-heading">最近会话</div>
      <nav class="session-list" id="sessionList" aria-label="会话列表"></nav>
      <div class="sidebar-bottom">
        <span class="connection-dot"></span>
        <span>本地聊天终端</span>
      </div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button class="icon-button menu-button" id="openSidebar" aria-label="打开会话列表">☰</button>
        <div class="current-title" id="currentTitle">新建会话</div>
        <button class="icon-button" id="renameSession" title="重命名会话" aria-label="重命名会话">✎</button>
      </header>
      <section class="conversation" id="conversation" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h1>有什么可以帮忙的？</h1>
          <p>开始一段新对话，模型回复会实时显示在这里。</p>
        </div>
        <div class="message-list" id="messageList"></div>
      </section>
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <div class="image-preview" id="imagePreview" hidden>
            <img id="previewImg" alt="待发送图片">
            <button type="button" class="preview-remove" id="removeImage" aria-label="移除图片">×</button>
          </div>
          <textarea id="messageInput" rows="1" maxlength="20000" placeholder="发送消息，可附图片…" aria-label="消息内容"></textarea>
          <div class="composer-actions">
            <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <button type="button" class="icon-button paint-button" id="paintButton" title="画画模式：输入描述直接生成图片" aria-label="画画模式">🎨</button>
            <button type="button" class="icon-button attach-button" id="attachButton" title="发送图片" aria-label="发送图片">📎</button>
            <span class="keyboard-hint">Enter 发送 · Shift+Enter 换行</span>
            <button type="button" class="stop-button" id="stopButton" hidden>停止生成</button>
            <button type="submit" class="send-button" id="sendButton" aria-label="发送">↑</button>
          </div>
        </form>
        <div class="disclaimer">AI 生成内容仅供参考，请核实重要信息。</div>
      </div>
    </main>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
