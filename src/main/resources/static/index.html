<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>辣条log · 有点上头的 AI 助手</title>
  <script>
    (function () {
      var theme = 'dark';
      try {
        theme = localStorage.getItem('latiao-theme')
          || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch (error) { /* 隐私模式等场景降级为夜间 */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand"><span class="brand-mark">🌶️</span><span>辣条log</span></div>
        <button class="icon-button mobile-close" id="closeSidebar" aria-label="关闭会话列表">×</button>
      </div>
      <button class="new-session" id="newSession"><span>＋</span> 新建会话</button>
      <input type="search" class="session-search" id="sessionSearch" placeholder="搜索会话…" aria-label="搜索会话">
      <div class="session-heading">最近会话</div>
      <nav class="session-list" id="sessionList" aria-label="会话列表"></nav>
      <div class="sidebar-bottom">
        <span class="connection-dot"></span>
        <span class="user-email" id="userEmail">未登录</span>
        <button type="button" class="logout-button" id="logoutButton" title="退出登录" hidden>退出</button>
      </div>
    </aside>
    <main class="main-panel">
      <header class="topbar">
        <button class="icon-button menu-button" id="openSidebar" aria-label="打开会话列表">☰</button>
        <div class="current-title" id="currentTitle">新建会话</div>
        <button class="icon-button" id="themeToggle" title="切换白天/夜间主题" aria-label="切换主题">🌙</button>
        <button class="icon-button" id="exportSession" title="导出本会话为 Markdown" aria-label="导出会话">⬇️</button>
        <button class="icon-button" id="renameSession" title="重命名会话" aria-label="重命名会话">✎</button>
      </header>
      <section class="conversation" id="conversation" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🌶️</div>
          <h1>老板来啦，辣条在的！</h1>
          <p>想聊点啥？可以让我看图 📎、画画 🎨、语音 🎤，也可以直接开吹～</p>
          <div class="welcome-chips">
            <button type="button" class="welcome-chip" data-fill="纳斯达克现在多少点？今天涨还是跌？">📈 纳指多少点</button>
            <button type="button" class="welcome-chip" data-fill="英伟达和苹果最近走势怎么样？">📊 英伟达 / 苹果</button>
            <button type="button" class="welcome-chip" data-fill="今天美股三大指数表现如何？">🇺🇸 美股三大指数</button>
            <button type="button" class="welcome-chip" data-fill="公司拖欠我三个月工资，我该怎么维权？">⚖️ 法律咨询</button>
          </div>
        </div>
        <div class="message-list" id="messageList"></div>
      </section>
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <div class="image-preview" id="imagePreview" hidden>
            <img id="previewImg" alt="待发送图片">
            <button type="button" class="preview-remove" id="removeImage" aria-label="移除图片">×</button>
          </div>
          <textarea id="messageInput" rows="1" maxlength="20000" placeholder="发送消息，可附图片…" aria-label="消息内容"></textarea>
          <div class="composer-actions">
            <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <button type="button" class="icon-button paint-button" id="paintButton" title="画画模式：输入描述直接生成图片" aria-label="画画模式">🎨</button>
            <button type="button" class="icon-button mode-button" id="modeButton" title="专业模式：严谨回答不上梗" aria-label="专业模式">🧑‍💼</button>
            <button type="button" class="icon-button legal-button" id="legalButton" title="法律模式：按结论/依据/风险/建议结构化回答" aria-label="法律模式">⚖️</button>
            <button type="button" class="icon-button web-button" id="webButton" title="联网搜索：实时检索最新信息后再回答" aria-label="联网搜索">🌍</button>
            <button type="button" class="icon-button attach-button" id="attachButton" title="发送图片" aria-label="发送图片">📎</button>
            <button type="button" class="icon-button mic-button" id="micButton" title="语音输入：点击开始录音，再点结束并转文字" aria-label="语音输入">🎤</button>
            <span class="keyboard-hint">Enter 发送 · Shift+Enter 换行</span>
            <button type="button" class="stop-button" id="regenerateButton" title="重新生成最后一条回答" hidden>↻ 重新生成</button>
            <button type="button" class="stop-button" id="stopButton" hidden>停止生成</button>
            <button type="submit" class="send-button" id="sendButton" aria-label="发送">↑</button>
          </div>
        </form>
        <div class="disclaimer">AI 生成内容仅供参考，请核实重要信息。</div>
      </div>
    </main>
  </div>
  <div class="auth-overlay" id="authOverlay" hidden>
    <div class="auth-card">
      <div class="brand auth-brand"><span class="brand-mark">🌶️</span><span>辣条log</span></div>
      <p class="auth-sub">登录后开始聊天，历史会话跟着你的账号走</p>
      <form id="authForm" class="auth-form">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" data-mode="login" role="tab">登录</button>
          <button type="button" class="auth-tab" data-mode="register" role="tab">注册</button>
        </div>
        <label class="auth-field">
          <span>邮箱</span>
          <input type="email" id="authEmail" required autocomplete="email" placeholder="you@example.com" maxlength="200">
        </label>
        <label class="auth-field" id="authNicknameField" hidden>
          <span>昵称（可选）</span>
          <input type="text" id="authNickname" maxlength="60" autocomplete="nickname" placeholder="老板">
        </label>
        <label class="auth-field">
          <span>密码</span>
          <input type="password" id="authPassword" required minlength="8" maxlength="72" autocomplete="current-password" placeholder="至少 8 位">
        </label>
        <label class="auth-field" id="authCodeField" hidden>
          <span>邮箱验证码</span>
          <div class="auth-code-row">
            <input type="text" id="authCode" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码">
            <button type="button" class="auth-code-button" id="sendCodeButton">获取验证码</button>
          </div>
        </label>
        <div class="auth-links">
          <button type="button" class="auth-link" id="forgotLink" hidden>忘记密码？</button>
          <button type="button" class="auth-link" id="backToLogin" hidden>← 返回登录</button>
        </div>
        <div class="auth-error" id="authError" hidden></div>
        <button type="submit" class="auth-submit" id="authSubmit">登录</button>
      </form>
    </div>
  </div>
  <div class="toast-region" id="toastRegion" aria-live="assertive"></div>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
