spring:
  application:
    name: ai-terminal
  datasource:
    url: jdbc:h2:file:./data/ai-terminal;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:missing}
      # 各兼容厂商 base-url（与 completions-path 拼成完整地址，均无需带 /v1 时另行说明）：
      #   智谱 GLM：  https://open.bigmodel.cn/api/paas/v4     （glm-4-flash 永久免费，注册送 2000 万 Token）
      #   DeepSeek：  https://api.deepseek.com
      #   通义千问：  https://dashscope.aliyuncs.com/compatible-mode/v1
      #   月之暗面：  https://api.moonshot.cn/v1
      #   硅基流动：  https://api.siliconflow.cn/v1
      #   OpenAI：    https://api.openai.com/v1
      #   Ollama：    http://localhost:11434/v1
      base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      chat:
        # 智谱/DeepSeek/通义/Ollama 等均为 /chat/completions；仅 OpenAI 官方需要完整路径
        completions-path: ${OPENAI_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${OPENAI_MODEL:glm-4-flash}
          temperature: ${AI_TEMPERATURE:0.7}
          max-tokens: ${AI_MAX_TOKENS:2048}
          top-p: ${AI_TOP_P:1.0}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # 账号体系：Token 签名密钥与有效期（生产环境必须用 APP_AUTH_SECRET 覆盖）
  auth:
    secret: ${APP_AUTH_SECRET:latiao-dev-secret-change-me}
    token-ttl-hours: ${APP_AUTH_TOKEN_HOURS:168}
  chat:
    # 辣条人设：活泼但准确；专业模式提示词见下
    system-prompt: "你是「辣条log」的 AI 助手，名字叫辣条——一根成精的辣条。性格热情上头、嘴硬心软、偶尔无厘头：自称「辣条」，称呼用户为「老板」。回答必须准确专业，语气可以活泼，每条回复最多带一个小梗；涉及代码、数据、事实时准确性绝对优先。当前日期：{currentDate}。请使用用户所用语言回答。"
    # 专业模式（前端 🧑‍💼 开关）：严谨不上梗
    professional-prompt: "你是一名可靠、严谨、清晰的 AI 助手。回答注重准确与效率，不使用口癖或玩梗。当前日期：{currentDate}。请使用用户所用语言回答。"
    max-history-turns: ${AI_MAX_HISTORY_TURNS:12}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:2048}
    top-p: ${AI_TOP_P:1.0}
    # 消息附带图片时使用的视觉模型（看图说话）
    vision-model: ${OPENAI_VISION_MODEL:glm-4.5v}
    # 用户上传图片的本地目录
    upload-dir: ${APP_UPLOAD_DIR:data/uploads}
  # 文生图（CogView；cogview-3-flash 免费，cogview-4 效果更好但收费）
  image:
    model: ${OPENAI_IMAGE_MODEL:cogview-3-flash}
    generations-path: ${OPENAI_IMAGE_GENERATIONS_PATH:/images/generations}
  # 语音：听（ASR 转写）与说（TTS 合成），OpenAI 兼容路径
  voice:
    asr-model: ${OPENAI_ASR_MODEL:glm-asr}
    tts-model: ${OPENAI_TTS_MODEL:glm-tts}
    voice: ${OPENAI_TTS_VOICE:tongtong}
    transcriptions-path: ${OPENAI_ASR_PATH:/audio/transcriptions}
    speech-path: ${OPENAI_TTS_PATH:/audio/speech}
